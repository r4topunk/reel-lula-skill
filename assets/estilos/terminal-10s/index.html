<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>grep FNDCT — terminal</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#050608;overflow:hidden}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#050608}
  canvas{display:block;background:#050608}
  #play{position:fixed;inset:0;display:flex;flex-direction:column;gap:22px;align-items:center;justify-content:center;
    background:rgba(0,0,0,.6);cursor:pointer;border:0;color:#E8EAED;font:700 16px 'JetBrains Mono',monospace;letter-spacing:.2em}
  #play .btn{width:130px;height:130px;border-radius:50%;border:3px solid #E4002B;display:flex;align-items:center;justify-content:center}
  #play .btn::after{content:"";margin-left:10px;border-style:solid;border-width:26px 0 26px 44px;border-color:transparent transparent transparent #E4002B}
  #play.hidden{display:none}

<body>
<div id="wrap"><canvas id="c" width="1080" height="1920"></canvas></div>
<button id="play" aria-label="Play"><div class="btn"></div><div>$ ./play --com-som</div></button>
<script>
(() => {
'use strict';
const W = 1080, H = 1920, DUR = 10, BPM = 124, B = 60 / BPM;
const MONO = "'JetBrains Mono', ui-monospace, Menlo, monospace";
const C = { bg: '#050608', win: '#0C0E12', bar: '#16191F', line: '#262A33', text: '#E8EAED', dim: '#7A818C',
  red: '#E4002B', str: '#F2C35B', path: '#7FD1C7', flag: '#9AA3AF' };

// ---------- timeline (beat grid, 124 BPM) ----------
const T_TYPE0 = 0.22, CH_DT = 0.036;                  // command typing
const CMD = [ // [text, color] segments; wrap after first line
  [['$ ', C.red], ['grep ', C.text], ['-c ', C.flag], ['"FNDCT"', C.str]],
  [['plano-flavio-2027-2030.pdf', C.path]],
];
const CMD_LEN = CMD.flat().reduce((n, s) => n + s[0].length, 0) - 2; // "$ " is the prompt, not typed
const T_ENTER = 4 * B;            // 1.935  Enter
const T_ZERO = 5 * B;             // 2.419  "0" prints, explodes (beat 4 = tape-stop silence)
const T_S2 = 9 * B;               // 4.355  "o que é"
const T_S3 = 15 * B;              // 7.258  end card
// seeded jitter for keystrokes, shared by picture and sound
const hash = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const keyTimes = (t0, n, dt, seed) => { const a = []; let t = t0; for (let i = 0; i < n; i++) { a.push(t); t += dt * (0.7 + 0.6 * hash(seed + i)); } return a; };
const K1 = keyTimes(T_TYPE0, CMD_LEN, CH_DT * 1.0, 10);
// scale so last key lands before Enter
{ const last = K1[K1.length - 1], k = (T_ENTER - 0.08 - T_TYPE0) / (last - T_TYPE0); for (let i = 0; i < K1.length; i++) K1[i] = T_TYPE0 + (K1[i] - T_TYPE0) * k; }
const CMD2 = 'whatis FNDCT', K2 = keyTimes(T_S2 + 0.06, CMD2.length, 0.03, 200);
const T_ENTER2 = T_S2 + B;        // beat 10
const S2_LINES = [ // [text, size, color, beat]
  ['FNDCT =', 104, C.red, 10, 800],
  ['o fundo que paga', 62, C.text, 10.5, 700],
  ['pesquisa, bolsa,', 62, C.text, 11, 700],
  ['Finep e startup de', 62, C.text, 11.5, 700],
  ['base tecnológica.', 62, C.text, 12, 700],
];
const T_NOPLANO = 13 * B;
const CMD3 = 'echo $SEGUNDO_TURNO', K3 = keyTimes(T_S3 + 0.05, CMD3.length, 0.022, 400);
const T_ENTER3 = T_S3 + 0.5 * B;
const T_DATE = 16 * B, T_LULA = 17 * B, T_FONTES = 18 * B;

// ---------- canvas ----------
const cv = document.getElementById('c'), c = cv.getContext('2d');
function resize() { const s = Math.min(innerWidth / W, innerHeight / H); cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px'; }
addEventListener('resize', resize); resize();
const off = document.createElement('canvas'); off.width = W; off.height = H; const o = off.getContext('2d');

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const P = (t, a, b) => clamp((t - a) / (b - a));
const eOut = x => 1 - Math.pow(1 - x, 3), eExpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const font = (sz, w = 700) => `${w} ${sz}px ${MONO}`;
const typed = (keys, t) => { let n = 0; while (n < keys.length && keys[n] <= t) n++; return n; };

// window geometry (Reels safe zone: top 140, bottom 220)
const WX = 36, WY = 150, WW = W - 72, WH = 1540, PADX = 72;

function drawWindow(g, title) {
  g.fillStyle = C.win; roundRect(g, WX, WY, WW, WH, 22); g.fill();
  g.strokeStyle = C.line; g.lineWidth = 2; roundRect(g, WX + 1, WY + 1, WW - 2, WH - 2, 22); g.stroke();
  g.save(); roundRect(g, WX, WY, WW, 78, 22); g.clip(); g.fillStyle = C.bar; g.fillRect(WX, WY, WW, 78); g.restore();
  g.fillStyle = C.line; g.fillRect(WX, WY + 78, WW, 2);
  ['#3A3F4A', '#3A3F4A', '#3A3F4A'].forEach((col, i) => { g.fillStyle = col; g.beginPath(); g.arc(WX + 42 + i * 36, WY + 39, 11, 0, 7); g.fill(); });
  g.fillStyle = C.dim; g.font = font(28, 400); g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(title, W / 2, WY + 40);
  g.textAlign = 'left'; g.textBaseline = 'alphabetic';
}
function roundRect(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function cursor(g, x, y, sz, t, solid) {
  const on = solid || ((t / (B)) % 1) < 0.55;
  if (!on) return; g.fillStyle = C.text; g.fillRect(x, y - sz * 0.78, sz * 0.6, sz * 0.95);
}
// draw colored segments, n chars visible; returns end x
function segs(g, list, x, y, sz, n) {
  g.font = font(sz, 700); let shown = 0;
  for (const [s, col] of list) {
    const k = clamp(n - shown, 0, s.length); if (k <= 0) break;
    const part = s.slice(0, k); g.fillStyle = col; g.fillText(part, x, y); x += g.measureText(part).width; shown += k;
  }
  return x;
}
function sourceFooter(g, lines, a) {
  if (a <= 0) return; g.globalAlpha = a; g.font = font(30, 400); g.fillStyle = C.dim;
  lines.forEach((l, i) => g.fillText(l, WX + PADX, WY + WH - 70 - (lines.length - 1 - i) * 42));
  g.globalAlpha = 1;
}
function scan(g, t) { // scanlines + vignette + seeded grain
  g.fillStyle = 'rgba(0,0,0,0.16)'; for (let y = 0; y < H; y += 4) g.fillRect(0, y, W, 2);
  const f = Math.floor(t * 30);
  for (let i = 0; i < 90; i++) { const x = hash(f * 131 + i) * W, y = hash(f * 71 + i * 3) * H; g.fillStyle = `rgba(255,255,255,${0.025 + 0.03 * hash(i + f)})`; g.fillRect(x, y, 2, 2); }
  const v = g.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.75);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.55)'); g.fillStyle = v; g.fillRect(0, 0, W, H);
}
// RGB-split text: three channel passes with 'lighter'
function rgbText(g, s, x, y, sz, w, split, col) {
  g.font = font(sz, w); g.textAlign = 'center'; g.textBaseline = 'middle';
  if (split < 0.5) { g.fillStyle = col; g.fillText(s, x, y); }
  else {
    g.save(); g.globalCompositeOperation = 'lighter';
    g.fillStyle = '#ff0022'; g.fillText(s, x - split, y + split * 0.15);
    g.fillStyle = '#00ff66'; g.fillText(s, x, y);
    g.fillStyle = '#2a4bff'; g.fillText(s, x + split, y - split * 0.15);
    g.restore();
  }
  g.textAlign = 'left'; g.textBaseline = 'alphabetic';
}

// ---------- scenes ----------
function scene1(g, t) {
  drawWindow(g, '~/planos — bash');
  const x0 = WX + PADX, y0 = WY + 200, LH = 78, SZ = 56;
  const n = t >= T_ENTER ? 999 : typed(K1, t) + 2;
  let x = segs(g, CMD[0], x0, y0, SZ, n);
  const n1 = CMD[0].reduce((a, s) => a + s[0].length, 0);
  let cx = x, cy = y0;
  if (n > n1) { cx = segs(g, CMD[1], x0, y0 + LH, SZ, n - n1); cy = y0 + LH; }
  const typing = t < T_ENTER && t > T_TYPE0 - 0.05;
  if (t < T_ENTER) cursor(g, cx + 4, cy, SZ, t, typing && t < K1[K1.length - 1] + 0.1);
  else if (t < T_ZERO) cursor(g, x0, y0 + LH * 2, SZ, 0, true); // waiting, frozen cursor (the silent beat)
  if (t >= T_ZERO) {
    // explode: from the output line to giant centre
    const k = eExpo(P(t, T_ZERO, T_ZERO + 0.32));
    const sz = 56 + (1020 - 56) * k;
    const sx = x0 + 17 + (W / 2 - x0 - 17) * k, sy = (y0 + LH * 2 - 20) + (1010 - (y0 + LH * 2 - 20)) * k;
    const shake = (1 - P(t, T_ZERO, T_ZERO + 0.5)) * 26;
    const jx = (hash(Math.floor(t * 60)) - 0.5) * shake, jy = (hash(Math.floor(t * 60) + 9) - 0.5) * shake;
    // split: big burst, decays; small re-hits on beats 6,7,8
    let split = 46 * (1 - P(t, T_ZERO, T_ZERO + 0.9));
    for (const bb of [6, 7, 8]) { const d = t - bb * B; if (d >= 0 && d < 0.09) split = Math.max(split, 18); }
    split += 3 * Math.sin(t * 9); // never fully settled
    rgbText(g, '0', sx + jx, sy + jy, sz, 800, split, C.text);
    // label + dashed pointer to source
    const la = P(t, T_ZERO + 0.45, T_ZERO + 0.75);
    if (la > 0) {
      g.globalAlpha = la; g.font = font(54, 700); g.textAlign = 'center'; g.fillStyle = C.text;
      g.fillText('menções a "FNDCT"', W / 2, 1450); g.fillStyle = C.dim; g.font = font(40, 400);
      g.fillText('no plano de governo 2027–2030', W / 2, 1510); g.textAlign = 'left'; g.globalAlpha = 1;
      const da = P(t, T_ZERO + 0.7, T_ZERO + 1.1), yA = 1540, yB = 1590;
      g.strokeStyle = C.red; g.lineWidth = 4; g.setLineDash([14, 12]); g.lineDashOffset = -t * 60;
      g.beginPath(); g.moveTo(W / 2, yA); g.lineTo(W / 2, yA + (yB - yA) * da); g.lineTo(W / 2 - (W / 2 - x0 - 10) * P(t, T_ZERO + 0.95, T_ZERO + 1.2), yB); g.stroke(); g.setLineDash([]);
      sourceFooter(g, ['fonte: plano de governo Flávio Bolsonaro', '2027–2030 (PDF publicado pela Agência Brasil)'], P(t, T_ZERO + 1.1, T_ZERO + 1.35));
    }
  }
}
function glitchSlices(g, src, t, amt) { // horizontal band displacement
  const f = Math.floor(t * 60);
  g.drawImage(src, 0, 0);
  for (let i = 0; i < 14; i++) {
    if (hash(f * 17 + i) > 0.55) continue;
    const y = Math.floor(hash(f * 5 + i * 13) * H), h = 8 + Math.floor(hash(f + i * 7) * 90), dx = (hash(f * 3 + i) - 0.5) * 2 * amt;
    g.drawImage(src, 0, y, W, h, dx, y, W, h);
  }
}
function scene2(g, t) {
  drawWindow(g, '~/planos — bash');
  const x0 = WX + PADX, y0 = WY + 200;
  const n = t >= T_ENTER2 ? 99 : typed(K2, t);
  const ex = segs(g, [['$ ', C.red], [CMD2, C.text]], x0, y0, 56, n + 2);
  if (t < T_ENTER2) cursor(g, ex + 4, y0, 56, t, t < K2[K2.length - 1] + 0.1);
  let y = y0 + 150;
  for (const [s, sz, col, bt, w] of S2_LINES) {
    const a = P(t, bt * B, bt * B + 0.08); if (a <= 0) break;
    const dx = (1 - eOut(P(t, bt * B, bt * B + 0.18))) * 40;
    g.globalAlpha = a; g.font = font(sz, w); g.fillStyle = col;
    if (s.startsWith('FNDCT')) { g.fillText('FNDCT', x0 - dx, y); g.fillStyle = C.text; g.fillText(' =', x0 - dx + g.measureText('FNDCT').width, y); }
    else g.fillText(s, x0 - dx, y);
    g.globalAlpha = 1; y += sz === 104 ? 110 : 84;
  }
  if (t >= T_NOPLANO) {
    const k = eExpo(P(t, T_NOPLANO, T_NOPLANO + 0.25));
    const yy = y + 70;
    g.font = font(62, 700); g.fillStyle = C.dim; g.fillText('# no plano dele:', x0, yy);
    // inverse-video red block
    g.font = font(120, 800); const s = '0 menções', tw = g.measureText(s).width;
    g.fillStyle = C.red; g.fillRect(x0 - 14, yy + 40, (tw + 28) * k, 150);
    g.save(); g.beginPath(); g.rect(x0 - 14, yy + 40, (tw + 28) * k, 150); g.clip();
    g.fillStyle = '#fff'; g.fillText(s, x0, yy + 160); g.restore();
    cursor(g, x0, yy + 330, 56, t, false);
  }
  sourceFooter(g, ['fonte: busca por "FNDCT" no PDF do plano', 'de governo 2027–2030 (Agência Brasil)'], P(t, T_NOPLANO, T_NOPLANO + 0.2));
}
function scene3(g, t) {
  drawWindow(g, '~ — bash');
  const x0 = WX + PADX, y0 = WY + 200;
  const n = t >= T_ENTER3 ? 99 : typed(K3, t);
  const segs3 = [['$ ', C.red], ['echo ', C.text], ['$SEGUNDO_TURNO', C.str]];
  const ex = segs(g, segs3, x0, y0, 56, n + 2);
  if (t < T_ENTER3) cursor(g, ex + 4, y0, 56, t, true);
  if (t >= T_DATE) {
    const k = eExpo(P(t, T_DATE, T_DATE + 0.2));
    g.globalAlpha = k; g.font = font(150, 800); g.fillStyle = C.text;
    g.fillText('25 DE', x0, 720 - (1 - k) * 30); g.fillText('OUTUBRO', x0, 880 - (1 - k) * 30); g.globalAlpha = 1;
  }
  if (t >= T_LULA) {
    const k = eExpo(P(t, T_LULA, T_LULA + 0.22));
    g.font = font(190, 800); const s = 'LULA 13', tw = g.measureText(s).width;
    const bx = x0 - 18, by = 960, bw = (tw + 36) * k, bh = 230;
    g.fillStyle = C.red; g.fillRect(bx, by, bw, bh);
    g.save(); g.beginPath(); g.rect(bx, by, bw, bh); g.clip(); g.fillStyle = '#fff'; g.fillText(s, x0, by + 182); g.restore();
    const sp = 18 * (1 - P(t, T_LULA, T_LULA + 0.2));
    if (sp > 1) { g.save(); g.beginPath(); g.rect(bx, by, bw, bh); g.clip(); g.globalAlpha = 0.85; g.fillStyle = '#00e5ff'; g.fillText(s, x0 + sp, by + 182 - sp * 0.2); g.fillStyle = '#fff'; g.fillText(s, x0, by + 182); g.restore(); }
  }
  if (t >= T_FONTES) {
    const a = P(t, T_FONTES, T_FONTES + 0.15);
    g.globalAlpha = a; g.font = font(54, 700); g.fillStyle = C.dim; g.fillText('# fontes na legenda', x0, 1340);
    g.fillStyle = C.red; g.fillText('$', x0, 1450); g.globalAlpha = 1; cursor(g, x0 + 66, 1450, 56, t, false);
  }
}

function seek(t) {
  t = ((t % DUR) + DUR) % DUR;
  o.setTransform(1, 0, 0, 1, 0, 0); o.fillStyle = C.bg; o.fillRect(0, 0, W, H);
  // camera: slow push-in per section, hard cuts on beats
  let z = 1, sc;
  if (t < T_S2) { z = 1 + 0.02 * P(t, 0, T_ZERO); if (t >= T_ZERO) z = 1.02 + 0.015 * eOut(P(t, T_ZERO, T_S2)); sc = scene1; }
  else if (t < T_S3) { z = 1.02 - 0.02 * eOut(P(t, T_S2, T_S3)); sc = scene2; }
  else { z = 1 + 0.025 * P(t, T_S3, DUR); sc = scene3; }
  o.save(); o.translate(W / 2, H / 2); o.scale(z, z); o.translate(-W / 2, -H / 2); sc(o, t); o.restore();
  scan(o, t);
  c.setTransform(1, 0, 0, 1, 0, 0);
  // glitch windows: the 0 impact, section cuts, LULA hit
  let g = 0;
  const hit = (a, d, amt) => { if (t >= a && t < a + d) g = Math.max(g, amt * (1 - (t - a) / d)); };
  hit(T_ZERO, 0.28, 140); hit(T_S2, 0.12, 90); hit(T_S3, 0.12, 90); hit(T_LULA, 0.15, 60);
  for (const bb of [6, 7, 8]) hit(bb * B, 0.06, 40);
  if (g > 1) glitchSlices(c, off, t, g); else c.drawImage(off, 0, 0);
  // flash on the 0
  const fl = 1 - P(t, T_ZERO, T_ZERO + 0.12);
  if (t >= T_ZERO && fl > 0) { c.fillStyle = `rgba(228,0,43,${0.35 * fl})`; c.fillRect(0, 0, W, H); }
  // tape-stop beat: screen dims/sags slightly (vertical squash)
  if (t >= T_ENTER && t < T_ZERO) { const k = P(t, T_ENTER, T_ZERO); c.fillStyle = `rgba(0,0,0,${0.35 * k})`; c.fillRect(0, 0, W, H); }
}

// ---------- score ----------
function noiseBuf(ac, secs, seed) {
  const n = Math.floor(ac.sampleRate * secs), b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
  let s = seed >>> 0 || 1; for (let i = 0; i < n; i++) { s = (s * 1664525 + 1013904223) >>> 0; d[i] = s / 2147483648 - 1; } return b;
}
function buildScore(ac, dest, T0) {
  // master: bus -> glue comp -> makeup -> limiter -> out
  const bus = ac.createGain(); bus.gain.value = 0.9;
  const comp = ac.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 4; comp.attack.value = 0.004; comp.release.value = 0.14;
  const make = ac.createGain(); make.gain.value = 1.7;
  const lim = ac.createDynamicsCompressor(); lim.threshold.value = -3; lim.knee.value = 0; lim.ratio.value = 20; lim.attack.value = 0.001; lim.release.value = 0.06;
  const out = ac.createGain(); out.gain.value = 0.82;
  bus.connect(comp).connect(make).connect(lim).connect(out).connect(dest);
  // music sub-bus with a lowpass we can sweep (tape-stop)
  const mus = ac.createGain(); const mlp = ac.createBiquadFilter(); mlp.type = 'lowpass'; mlp.frequency.value = 18000; mus.connect(mlp).connect(bus);
  const NB = noiseBuf(ac, 2, 12345);
  const at = x => T0 + x;
  const env = (g, t, a, peak, d) => { g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); };
  const noise = (t, dur, type, f, q, peak, d, out = mus, off = 0) => {
    const s = ac.createBufferSource(); s.buffer = NB; const fl = ac.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q;
    const g = ac.createGain(); env(g, t, 0.001, peak, d); s.connect(fl).connect(g).connect(out); s.start(t, off % 1.5); s.stop(t + dur);
  };
  const kick = (t, amp = 1, out = mus) => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.11);
    env(g, t, 0.002, amp, 0.32); o.connect(g).connect(out); o.start(t); o.stop(t + 0.4); noise(t, 0.02, 'highpass', 3000, 0.7, 0.18 * amp, 0.012, out); };
  const hat = (t, amp = 0.22, open = false) => noise(t, open ? 0.2 : 0.06, 'highpass', 8000, 0.8, amp, open ? 0.14 : 0.035, mus, t * 7);
  const clap = t => { for (let i = 0; i < 3; i++) noise(t + i * 0.011, 0.2, 'bandpass', 1500, 1.2, 0.5, i < 2 ? 0.02 : 0.16, mus, t * 3 + i); };
  const bass = (t, f, d, amp = 0.32, cut = 700) => { const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f;
    const fl = ac.createBiquadFilter(); fl.type = 'lowpass'; fl.Q.value = 9; fl.frequency.setValueAtTime(cut, t); fl.frequency.exponentialRampToValueAtTime(120, t + d);
    const g = ac.createGain(); env(g, t, 0.004, amp, d); o.connect(fl).connect(g).connect(mus); o.start(t); o.stop(t + d + 0.05); };
  const key = (t, i, amp = 0.5) => { // mechanical-ish key click: tick + filtered noise
    const f = 2600 + 1600 * hash(i * 3.3);
    noise(t, 0.03, 'bandpass', f, 2.5, amp, 0.018, bus, i * 0.37);
    const o = ac.createOscillator(), g = ac.createGain(); o.type = 'square'; o.frequency.value = 900 + 500 * hash(i); env(g, t, 0.0005, amp * 0.18, 0.006); o.connect(g).connect(bus); o.start(t); o.stop(t + 0.02);
    noise(t + 0.03 + 0.01 * hash(i + 5), 0.03, 'bandpass', 1200, 2, amp * 0.35, 0.012, bus, i * 0.11); // key release
  };
  const enter = t => { noise(t, 0.08, 'bandpass', 900, 1.5, 0.9, 0.05, bus, 0.7); noise(t + 0.045, 0.05, 'bandpass', 2200, 2, 0.5, 0.02, bus, 0.2);
    const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(70, t + 0.06); env(g, t, 0.001, 0.5, 0.08); o.connect(g).connect(bus); o.start(t); o.stop(t + 0.15); };
  const blip = (t, f, amp = 0.16) => { const o = ac.createOscillator(), g = ac.createGain(); o.type = 'square'; o.frequency.value = f; env(g, t, 0.001, amp, 0.05); o.connect(g).connect(bus); o.start(t); o.stop(t + 0.08); };
  const A1 = 55; // A

  // --- section 1: minimal pulse under typing (beats 0-3) ---
  for (let b = 0; b < 4; b++) { kick(at(b * B), 0.85); hat(at(b * B + B / 2)); if (b % 2) hat(at(b * B + B * 0.75), 0.12); }
  // drone that gets tape-stopped
  const dr = ac.createOscillator(), dr2 = ac.createOscillator(); dr.type = 'sawtooth'; dr2.type = 'square';
  const drf = ac.createBiquadFilter(); drf.type = 'lowpass'; drf.Q.value = 6; const drg = ac.createGain();
  dr.frequency.setValueAtTime(A1, at(0)); dr2.frequency.setValueAtTime(A1 * 1.5, at(0));
  drf.frequency.setValueAtTime(300, at(0)); drf.frequency.linearRampToValueAtTime(1400, at(T_ENTER));
  drg.gain.setValueAtTime(0.0001, at(0)); drg.gain.linearRampToValueAtTime(0.16, at(0.6)); drg.gain.setValueAtTime(0.18, at(T_ENTER));
  // tape-stop: pitch & filter fall over ~0.38s, then dead silence until the 0
  const ts = at(T_ENTER), te = ts + 0.38;
  dr.frequency.setValueAtTime(A1, ts); dr.frequency.exponentialRampToValueAtTime(7, te);
  dr2.frequency.setValueAtTime(A1 * 1.5, ts); dr2.frequency.exponentialRampToValueAtTime(10, te);
  drf.frequency.setValueAtTime(1400, ts); drf.frequency.exponentialRampToValueAtTime(60, te);
  drg.gain.setValueAtTime(0.2, ts); drg.gain.exponentialRampToValueAtTime(0.0001, te);
  dr.connect(drf); dr2.connect(drf); drf.connect(drg).connect(mus); dr.start(at(0)); dr2.start(at(0)); dr.stop(te + 0.02); dr2.stop(te + 0.02);
  // a slowing "tape" kick on the enter beat
  { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(150, ts); o.frequency.exponentialRampToValueAtTime(20, ts + 0.35); env(g, ts, 0.002, 0.6, 0.33); o.connect(g).connect(mus); o.start(ts); o.stop(ts + 0.38); }
  K1.forEach((kt, i) => key(at(kt), i, 0.42 + 0.12 * hash(i + 77)));
  enter(at(T_ENTER));

  // --- the 0: sub drop + impact + digital glitch ---
  const z = at(T_ZERO);
  { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(70, z); o.frequency.exponentialRampToValueAtTime(26, z + 1.4); g.gain.setValueAtTime(0.0001, z); g.gain.linearRampToValueAtTime(1.0, z + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, z + 1.8); o.connect(g).connect(bus); o.start(z); o.stop(z + 1.9); }
  kick(z, 1.2, bus);
  noise(z, 0.9, 'lowpass', 900, 0.7, 0.7, 0.6, bus, 0.3);
  noise(z, 0.5, 'highpass', 5000, 0.7, 0.25, 0.35, bus, 1.1);
  for (let i = 0; i < 9; i++) { const t = z + i * 0.028; if (hash(i + 900) < 0.3) continue; blip(t, 200 + 1800 * hash(i + 500), 0.14); }
  // glitch re-hits on beats 6,7,8
  for (const bb of [6, 7, 8]) { const t = at(bb * B); kick(t, 0.9); for (let i = 0; i < 3; i++) blip(t + i * 0.022, 300 + 1500 * hash(bb * 10 + i), 0.1); }
  hat(at(6.5 * B)); hat(at(7.5 * B)); hat(at(8.5 * B), 0.24, true);

  // --- section 2 groove (beats 9-14): kick, hats, clap 2&4, acid 16ths ---
  const acid = [1, 0, 1, 1, 0, 1, 0, 1]; const notes = [A1, A1, A1 * 2, A1, A1 * 1.5, A1, A1 * 1.189, A1];
  for (let b = 9; b < 15; b++) {
    const t = at(b * B); kick(t); hat(t + B / 2, 0.24); hat(t + B / 4, 0.08); hat(t + 3 * B / 4, 0.1);
    if (b % 2 === 0) clap(t);
    for (let s = 0; s < 4; s++) { const k = ((b - 9) * 4 + s) % 8; if (acid[k]) bass(t + s * B / 4, notes[k], B / 4 * 0.9, 0.28, 500 + 1400 * hash(b * 4 + s)); }
  }
  K2.forEach((kt, i) => key(at(kt), 100 + i, 0.38));
  enter(at(T_ENTER2));
  S2_LINES.forEach(([, , , bt], i) => blip(at(bt * B), 880 + i * 110, 0.12));
  // "0 menções": low hit + sub
  { const t = at(T_NOPLANO); kick(t, 1.1, bus); const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(60, t); o.frequency.exponentialRampToValueAtTime(32, t + 0.7); env(g, t, 0.005, 0.7, 0.8); o.connect(g).connect(bus); o.start(t); o.stop(t + 0.9); }
  // riser into end card
  { const s = ac.createBufferSource(); s.buffer = NB; s.loop = true; const fl = ac.createBiquadFilter(); fl.type = 'bandpass'; fl.Q.value = 3;
    const t1 = at(13.5 * B), t2 = at(T_S3); fl.frequency.setValueAtTime(400, t1); fl.frequency.exponentialRampToValueAtTime(7000, t2);
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t1); g.gain.exponentialRampToValueAtTime(0.3, t2 - 0.01); g.gain.linearRampToValueAtTime(0, t2);
    s.connect(fl).connect(g).connect(mus); s.start(t1); s.stop(t2 + 0.02); }

  // --- section 3: end card ---
  const e = at(T_S3);
  kick(e, 1.1); noise(e, 1.4, 'highpass', 4000, 0.5, 0.3, 1.2, mus, 0.5); // crash
  K3.forEach((kt, i) => key(at(kt), 300 + i, 0.32));
  enter(at(T_ENTER3));
  const stab = (t, amp = 0.2) => [A1 * 4, A1 * 4 * 1.189, A1 * 4 * 1.498].forEach(f => { const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f;
    const fl = ac.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.setValueAtTime(3000, t); fl.frequency.exponentialRampToValueAtTime(300, t + 0.5);
    const g = ac.createGain(); env(g, t, 0.003, amp / 3, 0.6); o.connect(fl).connect(g).connect(mus); o.start(t); o.stop(t + 0.7); });
  for (let b = 16; b < 20; b++) { const t = at(b * B); kick(t, 0.95); hat(t + B / 2, 0.2); if (b % 2 === 0) clap(t); bass(t + B / 2, A1, B / 2 * 0.8, 0.25, 600); }
  stab(at(T_DATE), 0.25);
  // LULA 13: big hit + sub
  { const t = at(T_LULA); kick(t, 1.2, bus); stab(t, 0.35); const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(65, t); o.frequency.exponentialRampToValueAtTime(30, t + 1.2); env(g, t, 0.005, 0.8, 1.4); o.connect(g).connect(bus); o.start(t); o.stop(t + 1.5); }
  blip(at(T_FONTES), 1320, 0.12);
  // final bar: kick at beat 20, then fade the tail to loop cleanly
  kick(at(20 * B), 0.8);
  bus.gain.setValueAtTime(0.9, at(DUR - 0.25)); bus.gain.linearRampToValueAtTime(0.0001, at(DUR - 0.01));
}
async function renderAudio() { const sr = 44100, oc = new OfflineAudioContext(2, sr * DUR, sr); buildScore(oc, oc.destination, 0); return oc.startRendering(); }

// ---------- ready / play ----------
const ready = Promise.all([
  document.fonts.load(font(56, 700)), document.fonts.load(font(56, 800)), document.fonts.load(font(30, 400)),
]).then(() => document.fonts.ready).catch(() => {});
let ac, t0 = 0, buf;
const playBtn = document.getElementById('play');
playBtn.onclick = async () => {
  playBtn.classList.add('hidden');
  ac = new AudioContext(); buf = buf || await renderAudio();
  const start = () => { const s = ac.createBufferSource(); s.buffer = buf; s.connect(ac.destination); t0 = ac.currentTime + 0.05; s.start(t0); s.onended = start; };
  start(); (function loop() { seek(Math.max(0, ac.currentTime - t0)); requestAnimationFrame(loop); })();
};
window.MOTION = { duration: DUR, bpm: BPM, ready, seek, renderAudio };
ready.then(() => seek(0));
})();
</script>
