<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>grep FNDCT 60s</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#0d0c0b;overflow:hidden}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0d0c0b}
  canvas{display:block}
  #play{position:fixed;inset:0;display:flex;flex-direction:column;gap:22px;align-items:center;justify-content:center;
    background:rgba(13,12,11,.7);cursor:pointer;border:0;color:#efe9dd;font:600 16px 'Inter Tight',sans-serif;letter-spacing:.3em}
  #play .btn{width:140px;height:140px;border-radius:50%;border:3px solid #E4002B;display:flex;align-items:center;justify-content:center}
  #play .btn::after{content:"";margin-left:10px;border-style:solid;border-width:28px 0 28px 46px;border-color:transparent transparent transparent #E4002B}
  #play.hidden{display:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1080" height="1920"></canvas></div>
<button id="play" aria-label="Play"><div class="btn"></div><div>PLAY COM SOM</div></button>
<script>
(() => {
'use strict';
const W = 1080, H = 1920, DUR = 60, BPM = 100, B = 60 / BPM;
const SERIF = "'Instrument Serif', Georgia, serif";
const GROT = "'Inter Tight', system-ui, sans-serif";
const MONO = "'JetBrains Mono', ui-monospace, Menlo, monospace";
const C = { bg: '#0d0c0b', paper: '#ece6da', ink: '#16130f', grey: '#5d574d', red: '#E4002B', white: '#f4f0e8', dim: '#9a9386' };
const AI_LABEL = 'Narração com voz sintética gerada por IA (Google Gemini)';

// ---------- timeline (s) — picture follows VO (ffprobe durations in vo.md) ----------
const T = {
  type: .2, sweep: .9, stop: 1.55, zero: 1.8,
  def: 6.0, defWords: 7.2, defEnd: 10.4, menc: 10.7,
  tem: 13.2, r1: 13.4, r2: 14.9, r3: 17.3,
  ponte: 21.0, lembrar: 23.4,
  hist: 24.6, h1: 24.8, h2: 29.8, h3: 33.1,
  sil: 35.6, silTxt: 36.3,
  vir: 39.0, v1: 39.2, v2: 40.75, v3: 43.9, v4: 45.5, v5: 48.7,
  rac: 50.6, racQ: 52.3, decide: 54.4,
  end: 55.6, lula: 57.3,
};
// VO: [file, start, duration] (durations measured with ffprobe after trim + atempo)
const VO = [
  ['b1', 2.0, 3.611], ['b2', 6.2, 6.791], ['b3', 13.4, 7.207], ['b4', 21.2, 3.071], ['b5', 24.8, 10.250],
  ['b6', 36.3, 2.323], ['b7', 39.2, 9.452], ['b8', 50.8, 4.596], ['b9', 56.0, 2.530],
];
const FREEZES = [[T.zero, .1], [T.v4, .1], [T.lula, .1]];   // 3-frame freeze on the big hits

// ---------- deterministic helpers ----------
const hash = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const P = (t, a, b) => clamp((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - x, 3);
const eo5 = x => 1 - Math.pow(1 - x, 5);
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const lerp = (a, b, x) => a + (b - a) * x;
const punch = (t, at, amt = .14) => 1 + amt * (1 - eo(P(t, at + .1, at + .45))) * (t >= at ? 1 : 0);

const cv = document.getElementById('c'), c = cv.getContext('2d');
function resize() { const s = Math.min(innerWidth / W, innerHeight / H); cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px'; }
addEventListener('resize', resize); resize();

// ---------- textures (seeded) ----------
function makeNoise(size, fn) {
  const o = document.createElement('canvas'); o.width = o.height = size; const x = o.getContext('2d');
  const im = x.createImageData(size, size);
  for (let i = 0; i < size * size; i++) { const [r, g, b, a] = fn(i, i % size, (i / size) | 0); im.data[i*4]=r; im.data[i*4+1]=g; im.data[i*4+2]=b; im.data[i*4+3]=a; }
  x.putImageData(im, 0, 0); return o;
}
const paperTex = makeNoise(256, (i, x, y) => {
  const n = hash(i) * 0.6 + hash(y * 3.1 + 7) * 0.25 + hash((x >> 3) + y * 91) * 0.15;
  const v = 224 + (n - 0.5) * 18;
  return [v + 14, v + 8, v - 4, 255];
});
const grainTex = makeNoise(256, i => { const v = hash(i + 9001) * 255; return [v, v, v, 12]; });
let paperPat = null, grainPat = null;
const pat = () => { if (!paperPat) { paperPat = c.createPattern(paperTex, 'repeat'); grainPat = c.createPattern(grainTex, 'repeat'); } };

// ---------- drawing primitives ----------
function txt(s, x, y, font, color, align = 'left', alpha = 1, base = 'alphabetic') {
  if (alpha <= 0) return;
  c.save(); c.globalAlpha *= alpha; c.font = font; c.fillStyle = color; c.textAlign = align; c.textBaseline = base; c.fillText(s, x, y); c.restore();
}
function wrapWords(s, font, maxW) {
  c.font = font; const words = s.split(' '); const lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (c.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); return lines;
}
function wrap(s, x, y, font, color, maxW, lh, align = 'left', alpha = 1) {
  const L = wrapWords(s, font, maxW); L.forEach((l, i) => txt(l, x, y + i * lh, font, color, align, alpha)); return L.length * lh;
}
function marker(x, y, w, h, p, seed, color = C.red, multiply = true, alpha = .9) {
  if (p <= 0) return;
  const ww = w * p; c.save(); if (multiply) c.globalCompositeOperation = 'multiply'; c.globalAlpha *= alpha; c.fillStyle = color; c.beginPath();
  const n = 12; c.moveTo(x, y + h * 0.12);
  for (let i = 1; i <= n; i++) c.lineTo(x + ww * i / n, y + h * 0.12 + (hash(seed + i) - .5) * h * .16);
  for (let i = n; i >= 0; i--) c.lineTo(x + ww * i / n, y + h * 0.95 + (hash(seed + 50 + i) - .5) * h * .14);
  c.closePath(); c.fill(); c.restore();
}
function paperRect(x, y, w, h, shadow = true) {
  c.save();
  if (shadow) { c.shadowColor = 'rgba(0,0,0,.55)'; c.shadowBlur = 40; c.shadowOffsetY = 18; }
  c.fillStyle = C.paper; c.fillRect(x, y, w, h); c.shadowColor = 'transparent';
  c.globalAlpha = .9; c.fillStyle = paperPat; c.fillRect(x, y, w, h); c.restore();
}
// card: paper at (cx,cy) rotated/scaled, draw(w,h) in local top-left coords
function card(cx, cy, w, h, rot, s, alpha, draw) {
  if (alpha <= 0) return;
  c.save(); c.globalAlpha *= alpha; c.translate(cx, cy); c.rotate(rot); c.scale(s, s); c.translate(-w / 2, -h / 2);
  paperRect(0, 0, w, h); draw(w, h); c.restore();
}
// stylized page with grey lines (no readable text)
function page(cx, cy, w, h, rot, seed, shade = 0) {
  c.save(); c.translate(cx, cy); c.rotate(rot);
  paperRect(-w/2, -h/2, w, h);
  const L = -w/2 + w * .11, R = w/2 - w * .11, lw = R - L;
  let y = -h/2 + h * .09;
  c.fillStyle = '#5d574d'; c.fillRect(L, y, lw * (0.35 + hash(seed + 1) * .25), h * .016); y += h * .045;
  c.fillStyle = '#b8b1a4'; c.fillRect(L, y, lw * .22, h * .007); y += h * .05;
  let k = 0;
  while (y < h/2 - h * .1) {
    const paraLen = 3 + Math.floor(hash(seed * 7 + k) * 6);
    for (let j = 0; j < paraLen && y < h/2 - h * .1; j++, k++) {
      const last = j === paraLen - 1;
      const len = last ? 0.25 + hash(seed + k * 3.3) * 0.5 : 0.9 + hash(seed + k * 1.7) * 0.1;
      c.fillStyle = '#aaa395'; c.fillRect(L, y, lw * len, h * .0065); y += h * .021;
    }
    y += h * .02;
    if (hash(seed + k * 13) > .8) { c.fillStyle = '#6f685d'; c.fillRect(L, y, lw * .4, h * .01); y += h * .035; }
  }
  if (shade > 0) { c.fillStyle = `rgba(13,12,11,${shade})`; c.fillRect(-w/2, -h/2, w, h); }
  c.restore();
}
function grain(t) { c.save(); const f = Math.floor(t * 24); c.translate(-hash(f) * 256, -hash(f + .5) * 256); c.fillStyle = grainPat; c.fillRect(0, 0, W + 256, H + 256); c.restore(); }
function vignette(a = .5) {
  const g = c.createRadialGradient(W/2, H/2, H * .25, W/2, H/2, H * .75);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${a})`); c.fillStyle = g; c.fillRect(0, 0, W, H);
}
// mono evidence line (top of content zone, below the 140 px unsafe band)
function evidence(s, a, color = C.dim, y = 205) { txt(s, 60, y, `500 36px ${MONO}`, color, 'left', a); }
function shake(t, at, amt = 16, dur = .45) { const k = (1 - P(t, at, at + dur)) * amt * (t >= at ? 1 : 0); const f = Math.floor(t * 60); return [(hash(f) - .5) * k, (hash(f + 3) - .5) * k]; }

// ---------- 1. HOOK 0 – 6.0 ----------
function hook(t) {
  const arrive = eo5(P(t, 0, .55));
  const pw = 760, ph = 900, baseY = 1010;
  const flips = [T.sweep + .3, T.sweep + .55];
  const dimPages = .7 * eo(P(t, T.zero, T.zero + .4));
  for (let i = 3; i >= 0; i--) {
    let fx = 0, fr = 0, fy = 0;
    if (i < 2) { const fp = eio(P(t, flips[i] - .2, flips[i] + .05)); fx = -fp * 1250; fr = -fp * .35; fy = -fp * 120; if (fp >= 1) continue; }
    const depth = i - (t > flips[0] ? 1 : 0) - (t > flips[1] ? 1 : 0), d = Math.max(depth, 0);
    const cx = W/2 + d * 20 + fx + (1 - arrive) * 60;
    const cy = baseY + d * 24 + fy + (1 - arrive) * (900 + i * 120);
    const rot = (hash(i + 3) - .5) * .05 + fr + d * .01;
    page(cx, cy, pw, ph, rot, 10 + i * 17, Math.min(.85, d * .18 + dimPages));
    if (depth === 0 && t >= T.sweep && t < T.stop) {
      const segs = [T.sweep, flips[0] - .1, flips[1] - .1, T.stop];
      const s = i === 0 ? 0 : i === 1 ? 1 : 2, sp = eio(P(t, segs[s], segs[s + 1]));
      c.save(); c.translate(cx, cy); c.rotate(rot);
      const by = -ph/2 + 80 + sp * (ph - 200);
      c.fillStyle = 'rgba(228,0,43,.18)'; c.fillRect(-pw/2, by - 46, pw, 92);
      c.fillStyle = C.red; c.fillRect(-pw/2, by - 2, pw, 4); c.restore();
    }
  }
  // terminal: the exact command behind F1
  const hIn = eo(P(t, 0, .35));
  c.save(); c.globalAlpha = hIn;
  c.fillStyle = 'rgba(22,19,15,.96)'; c.beginPath(); c.roundRect(60, 165, W - 120, 250, 16); c.fill();
  c.fillStyle = C.red; c.fillRect(60, 165, 8, 250);
  c.restore();
  const q = '"fndct"'; const nTyped = t < T.type ? 0 : Math.min(q.length, Math.floor((t - T.type) / .085) + 1);
  const F = `700 46px ${MONO}`;
  c.font = F; const pre = '$ grep -ci ', pw0 = c.measureText(pre).width, typed = q.slice(0, nTyped), tw = c.measureText(typed).width;
  txt(pre, 100, 235, F, '#efe9dd', 'left', hIn);
  txt(typed, 100 + pw0, 235, F, '#ffb3c0', 'left', hIn);
  txt('plano-flavio-2027-2030.txt', 100, 300, `500 46px ${MONO}`, '#c9c2b5', 'left', hIn);
  if (t < T.zero && (Math.floor(t / .3) % 2 === 0 || t < T.sweep)) { c.fillStyle = C.red; c.globalAlpha = hIn; c.fillRect(104 + pw0 + tw, 197, 24, 48); c.globalAlpha = 1; }
  if (t >= T.sweep && t < T.zero) txt('buscando' + '...'.slice(0, 1 + Math.floor(t / .12) % 3), 100, 375, `500 42px ${MONO}`, C.dim);
  if (t >= T.zero) { txt('0', 100, 378, `700 56px ${MONO}`, C.red); txt('# nenhuma ocorrência', 150, 376, `500 42px ${MONO}`, C.dim); }

  // THE ZERO — smaller, higher: glyph sits fully above the caption box
  if (t >= T.zero) {
    const zp = eo5(P(t, T.zero + .1, T.zero + .4));
    const [sx, sy] = shake(t, T.zero + .1, 18);
    const s = punch(t, T.zero, .16);
    c.save(); c.translate(W/2 + sx, 930 + sy); c.scale(s, s);
    c.globalAlpha = Math.max(.85, zp);
    c.font = `italic 720px ${SERIF}`; c.textAlign = 'center'; c.textBaseline = 'alphabetic';
    c.fillStyle = C.red; c.fillText('0', 0, 250);
    c.restore();
    const cp = eo(P(t, T.zero + .5, T.zero + .9)), cy = 1300 + (1 - cp) * 30;
    c.save(); c.globalAlpha = cp; c.fillStyle = 'rgba(13,12,11,.92)'; c.fillRect(60, cy - 100, W - 120, 250); c.restore();
    txt('menções a “FNDCT”', W/2, cy - 4, `800 76px ${GROT}`, C.white, 'center', cp);
    txt('no plano de governo do Flávio', W/2, cy + 86, `italic 66px ${SERIF}`, C.white, 'center', cp);
    marker(W/2 - 330, cy + 104, 660 * eio(P(t, 4.35, 4.75)), 12, 1, 9, C.red, false, 1);
  }
}

// ---------- 2. O QUE É 6.0 – 13.2 ----------
const DEF = 'o fundo federal que financia pesquisa e inovação no Brasil.';
function whatIs(t) {
  const inP = eo5(P(t, T.def, T.def + .45));
  const pw = 960, ph = 1290, rot = -0.012 + (1 - inP) * .05, cx = W/2, cy = 170 + ph/2 + (1 - inP) * 1300;
  c.save(); c.translate(cx, cy); c.rotate(rot); c.translate(-pw/2, -ph/2);
  paperRect(0, 0, pw, ph);
  const L = 70;
  txt('VERBETE', L, 90, `800 40px ${GROT}`, C.red);
  txt('Lei 11.540/2007, art. 1º', pw - 70, 90, `500 32px ${MONO}`, C.grey, 'right');
  c.fillStyle = C.ink; c.fillRect(L, 115, pw - 140, 4);
  const hw = eo(P(t, T.def + .15, T.def + .55));
  txt('FNDCT', L - 6, 290 + (1 - hw) * 30, `900 190px ${GROT}`, C.ink, 'left', hw);
  txt('(o fundo da ciência)', L, 372, `italic 62px ${SERIF}`, C.grey, 'left', eo(P(t, T.def + .5, T.def + .9)));
  const F = `italic 84px ${SERIF}`, lines = wrapWords(DEF, F, pw - 150), words = DEF.split(' ').length;
  let wi = 0;
  lines.forEach((ln, li) => {
    let x = L; const y = 490 + li * 96;
    for (const w of ln.split(' ')) {
      const a = T.defWords + (T.defEnd - T.defWords) * wi / words, wp = eo(P(t, a, a + .18));
      c.font = F; txt(w, x, y + (1 - wp) * 14, F, C.ink, 'left', wp);
      x += c.measureText(w + ' ').width; wi++;
    }
  });
  const yA = 490 + lines.length * 96;
  txt('Gerido pela Finep (Secretaria-Executiva).', L, yA + 10, `600 46px ${GROT}`, C.grey, 'left', eo(P(t, 9.6, 10.0)));
  c.fillStyle = C.ink; c.fillRect(L, yA + 60, (pw - 140) * eo(P(t, T.menc - .35, T.menc)), 3);
  const np = eo(P(t, T.menc - .1, T.menc + .25));
  txt('No plano dele:', L, yA + 160, `800 76px ${GROT}`, C.ink, 'left', np);
  c.font = `italic 176px ${SERIF}`; const zw = c.measureText('0 menções.').width;
  const s = punch(t, T.menc + .1, .06);
  c.save(); c.translate(L, yA + 330); c.scale(s, s);
  marker(-16, -150, zw + 36, 175, eio(P(t, T.menc + .1, T.menc + .5)), 77);
  txt('0 menções.', 0, 0, `italic 176px ${SERIF}`, C.ink, 'left', eo(P(t, T.menc, T.menc + .3)));
  c.restore();
  c.restore();
}

// ---------- 3. O QUE TEM 13.2 – 21.0 ----------
function oQueTem(t) {
  c.fillStyle = '#1a1714'; c.fillRect(0, 0, W, H);
  evidence('plano-flavio-2027-2030.txt  (84 págs.)', eo(P(t, T.tem, T.tem + .4)));
  const rows = [
    { at: T.r1, y: 440, h: 300, dir: -1, rot: -.018,
      draw: (w, h, a) => {
        txt('$ grep -n "Inteligência Artificial"', 50, 66, `500 34px ${MONO}`, C.grey);
        txt('Capítulo de IA? Tem.', 50, 170, `900 80px ${GROT}`, C.ink);
        txt('Estratégia Nacional de IA (p. 56) e mais (p. 25)', 50, 245, `italic 48px ${SERIF}`, C.grey);
      } },
    { at: T.r2, y: 800, h: 390, dir: 1, rot: .015,
      draw: (w, h, a) => {
        txt('$ grep "R\\$"  # valores em reais', 50, 66, `500 34px ${MONO}`, C.grey);
        txt('R$ para ciência?', 50, 160, `900 80px ${GROT}`, C.ink);
        const np = eio(P(a, T.r2 + 1.3, T.r2 + 1.7));
        c.font = `900 80px ${GROT}`; marker(36, 180, c.measureText('Nenhum valor.').width + 30, 92, np, 31);
        txt('Nenhum valor.', 50, 252, `900 80px ${GROT}`, C.ink, 'left', np > 0 ? 1 : 0);
        wrap('Único R$ de investimento: R$ 900 bi em infraestrutura (p. 51).', 50, 318, `italic 44px ${SERIF}`, C.grey, w - 100, 48);
      } },
    { at: T.r3, y: 1245, h: 470, dir: 0, rot: -.008,
      draw: (w, h, a) => {
        txt('p. 71 · linha 2666', 50, 66, `500 34px ${MONO}`, C.grey);
        txt('O que tem:', 50, 160, `900 80px ${GROT}`, C.ink);
        const Q = '“uma regra clara de controle de gastos discricionários dos três Poderes da União.”';
        const F = `italic 62px ${SERIF}`, L = wrapWords(Q, F, w - 100);
        L.forEach((ln, i) => {
          c.font = F; const lw = c.measureText(ln).width;
          marker(40, 196 + i * 70, lw + 20, 66, eio(P(a, T.r3 + .7 + i * .45, T.r3 + 1.15 + i * .45)), 200 + i, C.red, true, .72);
          txt(ln, 50, 250 + i * 70, F, C.ink);
        });
      } },
  ];
  // after r3 lands, push the first two up a bit and zoom slightly on the quote
  const push = eio(P(t, T.r3, T.r3 + .5));
  rows.forEach((r, i) => {
    if (t < r.at) return;
    const p = eo5(P(t, r.at, r.at + .4));
    const x = W/2 + (1 - p) * (r.dir === 0 ? 0 : r.dir * 1200);
    let y = r.y + (r.dir === 0 ? (1 - p) * 900 : 0);
    if (i < 2) y -= push * 60;
    const sc = i < 2 ? 1 - push * .06 : 1 + .02 * eo(P(t, T.r3 + .5, T.ponte));
    const dimA = i < 2 ? 1 - push * .35 : 1;
    card(x, y, 960, r.h, r.rot * (2 - p), sc, 1, (w, h) => { r.draw(w, h, t); if (dimA < 1) { c.fillStyle = `rgba(26,23,20,${1 - dimA})`; c.fillRect(0, 0, w, h); } });
  });
}

// ---------- 4. PONTE 21.0 – 24.6 ----------
function ponte(t) {
  c.fillStyle = C.bg; c.fillRect(0, 0, W, H);
  const zin = eo(P(t, T.ponte, T.hist));
  // extreme close-up: one page filling the frame, slow push-in
  c.save(); c.translate(W/2, 860); c.rotate(.035); c.scale(1 + zin * .05, 1 + zin * .05);
  const pw = 1100, ph = 1180; c.translate(-pw/2, -ph/2);
  paperRect(0, 0, pw, ph, false);
  txt('p. 24 · linhas 893–897', 130, 120, `500 34px ${MONO}`, C.grey);
  const Q = '“…dando continuidade ao trabalho que, no governo Bolsonaro, já havia conectado…”';
  const F = `italic 88px ${SERIF}`, L = wrapWords(Q, F, pw - 280);
  L.forEach((ln, i) => {
    c.font = F; const lw = c.measureText(ln).width;
    marker(120, 190 + i * 104, lw + 24, 96, eio(P(t, T.ponte + .4 + i * .35, T.ponte + .8 + i * .35)), 400 + i, C.red, true, .72);
    txt(ln, 130, 265 + i * 104, F, C.ink, 'left', eo(P(t, T.ponte + .1, T.ponte + .4)));
  });
  c.restore();
  // headline band
  const hp = eo5(P(t, T.ponte + .2, T.ponte + .6));
  c.save(); c.globalAlpha = hp; c.fillStyle = 'rgba(13,12,11,.94)'; c.fillRect(0, 1060, W, 420); c.restore();
  wrap('O plano do Flávio promete continuar um programa do governo Jair Bolsonaro.', 60, 1150 + (1 - hp) * 30, `800 66px ${GROT}`, C.white, W - 120, 78, 'left', hp);
  txt('Então, vale lembrar:', 60, 1420, `italic 72px ${SERIF}`, C.red, 'left', eo(P(t, T.lembrar, T.lembrar + .3)));
}

// ---------- 5. JÁ VIMOS ESSE FILME 24.6 – 35.6 ----------
function hist(t) {
  c.fillStyle = '#141210'; c.fillRect(0, 0, W, H);
  // ghost year in the background
  const yr = t < T.h2 ? '2021' : '2022';

  const mute = ac.createGain(); mute.gain.value = 1;     // tape-stop / true silence

  const sat = ac.createWaveShaper(); sat.curve = satCurve; sat.oversample = '2x'; const satG = ac.createGain(); satG.gain.value = .55; sat.connect(satG).connect(bus);

  const kick = (t, g = .6) => { tone(t, .42, { f: 120, f2: 42, g, a: .002 }); tone(t, .1, { f: 180, f2: 90, type: 'triangle', g: g * .35, a: .001 }); noise(t, .02, { type: 'highpass', f: 2500, g: g * .2 }); };
  const hat = (t, g = .08, pan = 0) => noise(t, .04, { type: 'highpass', f: 8000, g, pan });
  const clap = (t, g = .3) => { for (let k = 0; k < 3; k++) noise(t + k * .012, .12, { f: 1500, q: 1.1, g: g * (k === 2 ? 1 : .6), a: .001, send: .25 }); };

  const riser = (t0, t1, g = .22) => {

    s.connect(fl).connect(gg).connect(bus); s.start(t0); s.stop(t1 + .02);
    tone(t0, t1 - t0, { f: 220, f2: 880, type: 'sine', g: g * .25, a: (t1 - t0) * .9 });
  };
  // tape-stop: pitch + filter fall, then the caller mutes the bus
  const tapeStop = (t, dur = .16, g = .3) => {
    [146.8, 220, 293.7].forEach((f, i) => {
      const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * .18, t + dur);

  // room tone
  { const s = ac.createBufferSource(); s.buffer = nb; s.loop = true; const fl = ac.createBiquadFilter(); fl.type = 'bandpass'; fl.frequency.value = 5000; fl.Q.value = .5;
    const gg = ac.createGain(); gg.gain.setValueAtTime(0, at(0)); gg.gain.linearRampToValueAtTime(.02, at(.3)); gg.gain.setValueAtTime(.02, at(DUR - .5)); gg.gain.linearRampToValueAtTime(0, at(DUR - .05));

  paperFlip(at(.02), .2, .35); paperFlip(at(.14), -.2, .25);

  riser(at(T.sweep), at(T.stop), .25);
  tapeStop(at(T.stop - .02), .16);
  mute.gain.setValueAtTime(1, at(T.stop + .12)); mute.gain.linearRampToValueAtTime(0, at(T.stop + .15));
  mute.gain.setValueAtTime(0, at(T.zero - .005)); mute.gain.linearRampToValueAtTime(1, at(T.zero));
  boom(at(T.zero), 1.0, 3.0);
  hitChord(at(T.zero), [36.7, 73.4, 110, 146.8, 220], .11, 2.6, 2000);
  // 2–13: D minor drone + pulse
  pad(at(T.zero + .2), at(T.tem), [73.4, 87.3, 110, 146.8], .035, 520);
  beatsIn(3.0, T.tem, (b, k) => { kick(at(b), .42); if (k % 2) penTick(at(b + B / 2), (k % 4 === 1 ? .3 : -.3), .14); });
  beatsIn(T.def, T.tem, (b, k) => { [146.8, 174.6, 220, 174.6][k % 4] && pluck(at(b + B / 2), [146.8, 174.6, 220, 174.6][k % 4], .05, .2); });
  riser(at(T.def - .5), at(T.def - .02), .16); paperFlip(at(T.def - .08), 0, .6); slam(at(T.def), .55);
  hitChord(at(T.def), [73.4, 110, 146.8], .06, 1.4, 1400);
  { const words = DEF.split(' ').length; for (let i = 0; i < words; i++) penTick(at(T.defWords + (T.defEnd - T.defWords) * i / words), (hash(i) - .5) * .6, .12); }
  boom(at(T.menc), .6, 2.0); markerStroke(at(T.menc + .1), .45, .3, 0);
  // 3 O QUE TEM 13.2–21: groove + hats, stamps
  pad(at(T.tem), at(T.ponte), [73.4, 87.3, 110, 130.8], .032, 650);
  beatsIn(T.tem, T.ponte, (b, k) => { kick(at(b), .45); hat(at(b + B / 2), .07, .25); if (k % 2) hat(at(b + B / 4), .04, -.25); pluck(at(b + B / 2), [146.8, 174.6, 220, 261.6][k % 4], .045, -.2); });
  [T.r1, T.r2, T.r3].forEach((x, i) => { paperFlip(at(x - .05), i % 2 ? .4 : -.4, .5); slam(at(x + .3), .5); });
  markerStroke(at(T.r2 + 1.3), .4, .26); markerStroke(at(T.r3 + .7), 1.4, .22);
  // 4 PONTE 21–24.6: thin out, heartbeat
  pad(at(T.ponte), at(T.hist), [73.4, 110, 146.8], .03, 420);
  beatsIn(T.ponte, T.hist, (b, k) => { if (k % 2 === 0) { kick(at(b), .5); kick(at(b + .18), .3); } });
  markerStroke(at(T.ponte + .4), 1.0, .2); penTick(at(T.lembrar), 0, .25);
  // 5 HIST 24.6–35.6: darker, pulse, slams on each clipping, small build at the end
  pad(at(T.hist), at(T.sil), [58.3, 73.4, 87.3, 116.5], .04, 480);
  beatsIn(T.hist, T.sil, (b, k) => { kick(at(b), .5); hat(at(b + B / 2), .05); if (k % 4 === 2) clap(at(b), .14); });
  [T.h1, T.h2, T.h3].forEach(x => { slam(at(x + .22), .9); noise(at(x + .22), .3, { type: 'lowpass', f: 300, g: .45 }); });
  boom(at(T.h2 + 1.2), .55, 1.6);                    // BLOQUEADO stamp
  markerStroke(at(T.h1 + 2.4), .5, .26); markerStroke(at(T.h3 + .9), .4, .26);
  riser(at(T.sil - 1.6), at(T.sil - .02), .16);
  // 6 SILÊNCIO: tape-stop, then true silence (only the voice)
  tapeStop(at(T.sil - .02), .2, .35);
  mute.gain.setValueAtTime(1, at(T.sil + .15)); mute.gain.linearRampToValueAtTime(0, at(T.sil + .2));
  mute.gain.setValueAtTime(0, at(T.vir - .005)); mute.gain.linearRampToValueAtTime(1, at(T.vir));

  beatsIn(T.vir + B, T.rac, (b, k) => {
    kick(at(b), .55); if (k % 2) clap(at(b), .22);

    pluck(at(b), [293.7, 370, 440, 370][k % 4], .05, -.2); pluck(at(b + B / 2), [440, 587.3, 440, 554.4][k % 4], .04, .25);
  });
  slam(at(T.v1 + .3), .6); markerStroke(at(T.v1 + .3), .35, .3);
  slam(at(T.v2), .6); for (let i = 0; i < 8; i++) penTick(at(T.v2 + i * .085), 0, .12);
  markerStroke(at(T.v2 + 1.0), .4, .24);
  slam(at(T.v3), .6); paperFlip(at(T.v3 - .05), .3, .5); markerStroke(at(T.v3 + .6), .4, .24);
  riser(at(T.v4 - 1.4), at(T.v4 - .03), .3);
  boom(at(T.v4), 1.0, 2.8); hitChord(at(T.v4), [36.7, 73.4, 146.8, 185, 220, 293.7], .11, 2.4, 3200);
  for (let i = 0; i < 4; i++) tone(at(T.v5 + .1 + i * .18), .07, { f: 1760, type: 'square', g: .05, lp: 3000 });
  // 8 RACIONAL 50.6–55.6: groove drops, pad + soft pulse
  pad(at(T.rac), at(T.end + .2), [73.4, 92.5, 110, 146.8], .03, 600);
  beatsIn(T.rac, T.end, (b, k) => { if (k % 2 === 0) kick(at(b), .35); });
  slam(at(T.racQ), .4); paperFlip(at(T.racQ - .05), .4, .45);
  penTick(at(T.decide), 0, .3);
  // 9 END CARD
  riser(at(T.end - B), at(T.end - .03), .24);
  boom(at(T.end), .95, 2.8); hitChord(at(T.end), [36.7, 73.4, 110, 146.8, 185, 220], .1, 2.6, 2600);
  paperFlip(at(T.end - .05), 0, .4);
  markerStroke(at(T.lula - .05), .3, .3, 0); kick(at(T.lula), .6); slam(at(T.lula), .7);
  hitChord(at(T.lula), [146.8, 185, 220, 293.7], .07, 2.0, 3000);
  penTick(at(T.lula + .6), 0, .25);
  pad(at(T.end), at(DUR - .1), [73.4, 92.5, 110, 146.8], .03, 700);

  const voComp = ac.createDynamicsCompressor(); voComp.threshold.value = -20; voComp.ratio.value = 3; voComp.attack.value = .003; voComp.release.value = .12;
  const voG = ac.createGain(); voG.gain.value = 1.25; voComp.connect(voG).connect(sum);
  VO.forEach(([n, st, d], i) => {
    const b = voBufs[i]; if (!b) return;
    const s = ac.createBufferSource(); s.buffer = b; s.connect(voComp); s.start(at(st));

    duck.gain.setValueAtTime(1, at(st - .12)); duck.gain.linearRampToValueAtTime(.32, at(st - .02));

}
async function renderAudio() {

}

// ---------- fonts / ready (fail visibly) ----------
const FONTS = [`italic 100px 'Instrument Serif'`, `800 100px 'Inter Tight'`, `900 100px 'Inter Tight'`, `600 100px 'Inter Tight'`, `500 100px 'JetBrains Mono'`, `700 100px 'JetBrains Mono'`];
const ready = Promise.all(FONTS.map(f => document.fonts.load(f))).then(() => document.fonts.ready).then(() => {
  fontsOK = FONTS.every(f => document.fonts.check(f));
  if (!fontsOK) console.error('fonts missing: rendering would fall back to system fonts');
}).catch(e => { fontsOK = false; console.error('font load failed', e); }).then(() => loadVO()).then(() => seek(0));

// ---------- live playback: buffers scheduled back-to-back (no gap, no drift) ----------
let ac, t0, buf, raf, next;
const playBtn = document.getElementById('play');
playBtn.onclick = async () => {
  playBtn.classList.add('hidden');
  ac = ac || new AudioContext(); await ac.resume(); buf = buf || await renderAudio();
  next = ac.currentTime + .1; t0 = next;
  const sched = () => { const s = ac.createBufferSource(); s.buffer = buf; s.connect(ac.destination); s.start(next); next += buf.duration; };
  sched(); sched();
  cancelAnimationFrame(raf);
  (function loop() { if (ac.currentTime > next - buf.duration) sched(); seek(Math.max(0, ac.currentTime - t0) % DUR); raf = requestAnimationFrame(loop); })();
};

window.MOTION = { duration: DUR, bpm: BPM, ready, seek, renderAudio };
})();
